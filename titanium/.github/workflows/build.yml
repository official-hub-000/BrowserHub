name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'self-hosted' # ubuntu-latest
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Update 
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push
          fi

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
    
      - name: Build
        env:
            DEBIAN_FRONTEND: noninteractive
            LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
            STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          ./build.sh

      - name: Set
        run: |
          # Collect whichever artifacts this build actually produced. The
          # original assumed all three always exist and passed an empty
          # argument to mv when one was missing, which fails the step.
          cd chromium/src/out/release
          for f in *.aab *.apk; do
            [ -e "$f" ] || continue
            # Strip the "-<abi>.<ext>" suffix to recover the version. Do NOT use
            # ${f%-*}: the ABI names contain hyphens, so that strips only to the
            # last one and yields "100.0.0.0-arm64".
            base=$(echo "$f" | sed 's/-\(arm64-v8a\|armeabi-v7a\)\.\(apk\|aab\)$//')
            abi=$(echo "$f"  | sed 's/.*-\(arm64-v8a\|armeabi-v7a\)\.\(apk\|aab\)$/\1/')
            ext="${f##*.}"
            new="$base-\${{ env.unix_time }}-${abi}.${ext}"
            mv "$f" "$new"
            echo "Moved $f -> $new"
          done
          export VERSION=$(ls *-arm64-v8a.apk *-armeabi-v7a.apk 2>/dev/null | head -1 | sed 's/-.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          # Publish whatever exists rather than a fixed three-file list.
          files: |
            *.aab
            *.apk

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.aab
            *.apk
