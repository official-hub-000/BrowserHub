name: Build Play Store AAB & Signed APK

# This replaces the workflow the repo used for the old web-wrapper layout
# (android/ subproject + npm build). The project is now a single-module native
# Compose app at the repository root.
#
# Toolchain pinned from the official AGP compatibility matrix:
#   AGP 9.1.1  ->  Gradle 9.3.1 minimum (default 9.3.1), JDK 17, build-tools 36.0.0
# AGP 9 bundles Kotlin itself, so the org.jetbrains.kotlin.android plugin must
# NOT be applied; only the Compose compiler plugin is, which is already the case.
#
# What the runner must supply, because none of it is in the tree:
#   - JDK 17                    (setup-java)
#   - Android SDK 36 + build-tools 36.0.0   (sdkmanager, on the runner image)
#   - Gradle 9.x                 (gradle/actions/setup-gradle)
#   - google-services.json       (generated below)
#   - signing key                (generated below)

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$SDK" > local.properties

      - name: Setup Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The google-services plugin aborts the build when this file is absent,
      # and the app genuinely needs Firebase (AI engine + App Check). A real
      # project config cannot be invented, so this placeholder lets the build
      # complete; the APK installs and every non-AI feature works, while
      # Firebase-backed AI stays inert until a real file is supplied.
      # To use the real one: add a FIREBASE_JSON secret and this step picks it up.
      - name: Provide google-services.json
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
            echo "Using FIREBASE_GOOGLE_SERVICES_JSON secret."
          else
            echo "No secret found - writing placeholder config." 
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "browserhub-build",
              "storage_bucket": "browserhub-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.browserhub.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyPLACEHOLDER0000000000000000000000" } ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # app/build.gradle.kts signs both debug and release with
      # ${rootDir}/debug.keystore, so the file has to exist at the root.
      - name: Create debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out/
          sha256sum out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrowserHub-debug-apk
          path: out/*.apk
          if-no-files-found: error
